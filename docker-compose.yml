version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sms_postgres
    restart: always
    environment:
      POSTGRES_USER: meshsms
      POSTGRES_PASSWORD: secret_meshsms_pw
      POSTGRES_DB: meshsms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshsms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: sms_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jasmin:
    image: jookies/jasmin:latest
    container_name: sms_jasmin
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "2775:2775"   # SMPP Server Port (for downstream SMPP clients)
      - "8990:8990"   # JCli Telnet Management Port
      - "1401:1401"   # Jasmin HTTP API Port
    environment:
      - REDIS_CLIENT_HOST=redis
      - REDIS_CLIENT_PORT=6379
      - AMQP_BROKER_HOST=rabbitmq
      - AMQP_BROKER_PORT=5672
      - ENABLE_PUBLISH_SUBMIT_SM_RESP=1
    volumes:
      - ./jasmin_store:/etc/jasmin/store
      - ./jasmin_logs:/var/log/jasmin

  # SMPP Simulator for local end-to-end testing without a real carrier bind
  smppsim:
    image: meltedice/smppsim:latest
    container_name: sms_smppsim
    ports:
      - "2776:2775" # Simulated Carrier SMPP Port
      - "8088:88"   # Simulator Web UI

  # MeshSMS API and Billing Middleware
  meshsms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_meshsms
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      jasmin:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://meshsms:secret_meshsms_pw@postgres:5432/meshsms
      - JASMIN_SEND_URL=http://jasmin:1401/send
      - JASMIN_USER=gateway_api_user
      - JASMIN_PASS=super_secret_pwd
      - PUBLIC_DLR_CALLBACK_URL=http://meshsms:8000/internal/dlr-webhook
      - MOCK_JASMIN=false
      - DEFAULT_COST_PER_SEGMENT=0.0150
      - DLR_EXPIRY_HOURS=72

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
